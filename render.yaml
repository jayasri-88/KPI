# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Retail KPI Intelligence Platform - Backend Web Service
# ==============================================================================

services:
  - type: web
    name: retail-kpi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Retail KPI Intelligence Platform"
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard (e.g. Supabase or Render Postgres)
      - key: REDIS_URL
        sync: false # Set securely in Render dashboard (e.g. Upstash or Render Redis)
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a 32-byte cryptographically secure random string
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a 32-byte cryptographically secure random string
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GEMINI_API_KEY
        sync: false # Enter your free Google AI Studio key in Render dashboard
      - key: CORS_ORIGINS
        sync: false # e.g. https://retail-kpi.vercel.app,http://localhost:5173
