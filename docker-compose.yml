version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL with PostGIS Spatial Extension
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: retail_kpi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_kpi}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail_user} -d ${POSTGRES_DB:-retail_kpi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: retail_kpi_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. FastAPI Analytical Backend & AI Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_kpi_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_NAME: "Retail KPI Intelligence Platform"
      DATABASE_URL: postgresql://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_secure_password_2026}@db:5432/${POSTGRES_DB:-retail_kpi}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_64_char_hex_secret_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_64_char_hex_jwt_secret_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. React Vite Web Frontend (Nginx Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: retail_kpi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
